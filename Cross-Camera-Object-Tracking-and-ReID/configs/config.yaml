detector:
  model_name: "yolov8n.pt"
  confidence_threshold: 0.35
  iou_threshold: 0.45
  classes: [0, 2, 3, 5, 7]
  device: "cpu"

tracker:
  max_age: 30
  n_init: 3
  nms_max_overlap: 1.0
  max_iou_distance: 0.7
  embedder: "mobilenet"

reid:
  model_name: "resnet50"
  embedding_dim: 2048
  similarity_metric: "cosine"
  match_threshold: 0.65
  gallery_update_interval: 10

io:
  output_dir: "outputs"
  save_video: true
  save_annotations: true
  draw_labels: true

runtime:
  frame_skip: 1
  log_level: "INFO"
